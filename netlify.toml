# Situs statis: folder web/ disajikan apa adanya, tanpa build.
[build]
  publish = "web"

# Header keamanan untuk semua halaman.
# CSP membatasi: skrip hanya dari situs sendiri + jsdelivr (supabase-js, versi terkunci); koneksi data dan audio hanya ke
# project Supabase chord-finder. Bila project Supabase diganti, ubah alamatnya di connect-src dan media-src.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: https://lzthqhlyekkuvjibaopu.supabase.co; connect-src 'self' https://lzthqhlyekkuvjibaopu.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

# Service worker tidak boleh di-cache browser, supaya pembaruan selalu terambil.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
